name: Build Binaries

on:
  push:
    tags:
      - 'v*'

# Required so the default GITHUB_TOKEN can create the release and upload assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Download dependencies
      run: go mod download

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        # Strip the leading "v" from the tag (e.g. v1.1.15 -> 1.1.15) and bake it
        # into the binary so -h reports the released version.
        VERSION="${GITHUB_REF_NAME#v}"
        OUT="dsRNAmax-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}"
        go build -ldflags "-X main.Version=${VERSION}" -o "${OUT}"

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dsRNAmax-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
        fail_on_unmatched_files: true
        # Tags with a pre-release suffix (e.g. v1.1.15-beta.1) are marked as a
        # GitHub pre-release; clean tags (e.g. v1.1.15) are full releases.
        prerelease: ${{ contains(github.ref_name, '-') }}
        body: |
          ## Download Instructions

          - For Linux (64-bit): Download `dsRNAmax-linux-amd64`
          - For Linux (ARM64): Download `dsRNAmax-linux-arm64`
          - For Windows (64-bit): Download `dsRNAmax-windows-amd64.exe`
          - For macOS (Intel): Download `dsRNAmax-darwin-amd64`
          - For macOS (Apple Silicon): Download `dsRNAmax-darwin-arm64`
